<title>Caseload</title>
<style>
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#1b2430; --dim:#5f6b7a; --line:#dbe2ea;
  --accent:#2d5f8f; --accent-soft:#e1ebf5;
  --red:#c2412f; --red-soft:#fbe4df; --amber:#9a6400; --amber-soft:#fbefd5;
  --blue:#2d5f8f; --blue-soft:#e1ebf5; --green:#2f7a4a; --green-soft:#e1f1e6;
  --font: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#11161c; --card:#1a212a; --ink:#e8edf3; --dim:#97a3b2; --line:#2a333e;
    --accent:#8bb8e6; --accent-soft:#1c2b3b; --red:#ff8a7e; --red-soft:#3a1f1c;
    --amber:#f2b84b; --amber-soft:#3a2f17; --blue:#8bb8e6; --blue-soft:#1c2b3b;
    --green:#7bd39a; --green-soft:#1b3324; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#11161c; --card:#1a212a; --ink:#e8edf3; --dim:#97a3b2; --line:#2a333e;
    --accent:#8bb8e6; --accent-soft:#1c2b3b; --red:#ff8a7e; --red-soft:#3a1f1c;
    --amber:#f2b84b; --amber-soft:#3a2f17; --blue:#8bb8e6; --blue-soft:#1c2b3b;
    --green:#7bd39a; --green-soft:#1b3324; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 90px)}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:14px;margin-bottom:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:22px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;line-height:1.25}
.row .s{font-size:13.5px;color:var(--dim);margin-top:2px}
.tap{background:none;border:0;text-align:left;width:100%;padding:0}
.row.tap{padding:13px 14px;width:100%}
.chk{width:32px;height:32px;border-radius:8px;border:2.5px solid var(--dim);background:var(--card);flex:none;display:grid;place-items:center;font-size:19px;font-weight:800;padding:0;line-height:1}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.chkwrap{display:grid;justify-items:center;gap:3px;flex:none;background:none;border:0;padding:0;color:var(--dim);font-size:11px;font-weight:600}
.icon{background:none;border:0;padding:8px;font-size:19px;flex:none;color:var(--dim)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-red{background:var(--red-soft);color:var(--red)} .p-amb{background:var(--amber-soft);color:var(--amber)}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-green{background:var(--green-soft);color:var(--green)}
.p-dim{background:var(--line);color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--dim)}
.rcard{border-left-width:5px}
.rcard.u-grn{border-left-color:var(--green)}
button.pill.tp{border:0;font-family:inherit;font-size:12.5px;padding:6px 10px;cursor:pointer}
button.pill.tp:active{transform:scale(.95)}
.rcard.u-red{border-left-color:var(--red)} .rcard.u-amb{border-left-color:var(--amber)} .rcard.u-blue{border-left-color:var(--blue)}
.rcard.u-red .rhead{background:var(--red-soft)} .rcard.u-amb .rhead{background:var(--amber-soft)}
.prog{height:6px;background:var(--line);margin:0 14px;border-radius:99px;overflow:hidden}
.prog div{height:100%;background:var(--green);border-radius:99px}
.progtxt{font-size:12px;color:var(--dim);font-weight:600;padding:5px 14px 8px}
.row.faded .t{color:var(--dim);text-decoration:line-through}
button.stat{font:inherit;color:inherit;width:100%;cursor:pointer;position:relative}
button.stat:active{transform:scale(.97)}
button.stat i{position:absolute;top:10px;right:12px;font-style:normal;color:var(--dim);font-size:18px;line-height:1}
.stat.red b{color:var(--red)} .stat.amb b{color:var(--amber)} .stat.grn b{color:var(--green)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;background:var(--accent);color:var(--card)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px;white-space:nowrap;flex:none}
.btn.wide{width:100%;margin-top:10px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.empty{padding:22px;text-align:center;color:var(--dim)}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
.nav button{flex:1;max-width:160px;background:none;border:0;padding:6px;font-size:12px;color:var(--dim);display:grid;gap:2px;justify-items:center}
.nav button i{font-style:normal;font-size:21px}
.nav button.on{color:var(--accent);font-weight:700}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;font-size:16px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.req{display:flex;align-items:center;gap:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--dim);margin:12px 2px 6px;font-weight:600}
.field{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:650}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.warn{color:var(--red);font-size:13.5px;margin-top:6px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:30;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:var(--bg);font-weight:800;text-decoration:underline}
.note{font-size:13.5px;color:var(--dim);line-height:1.45;padding:2px 4px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)} .sw.on::after{left:23px}
</style>
</head>

<script>
(function(){

var KEY="caseload-v1";

/* ---------- storage ---------- */
var DB={clients:[],visits:[],done:{},revs:[],settings:{remind:3}};
function load(){try{var v=localStorage.getItem(KEY);if(v){var d=JSON.parse(v);DB.clients=d.clients||[];DB.visits=d.visits||[];DB.done=d.done||{};DB.revs=d.revs||[];DB.settings=Object.assign({remind:3},d.settings||{});}}catch(e){}upgrade()}
/* new paperwork steps: if Finalize was already checked, the steps before it were too */
function upgrade(){var ch=false;Object.keys(DB.done).forEach(function(k){if(/\|fin$/.test(k)){var b=k.slice(0,-3);["meet","chg","sig"].forEach(function(x){if(!DB.done[b+x]){DB.done[b+x]=DB.done[k];ch=true}})}});if(!DB.revs)DB.revs=[];if(ch)save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast("Couldn't save on this phone");}}

/* ---------- dates ---------- */
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function diff(a,b){return Math.round((b-a)/864e5)}
function fmt(d){if(typeof d==="string")d=parse(d);return (d.getMonth()+1)+"/"+d.getDate()+"/"+String(d.getFullYear()).slice(2)}
function fmtLong(d){return d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}
function inDays(n){if(n===0)return "today";if(n===1)return "tomorrow";if(n===-1)return "yesterday";return n>0?"in "+n+" days":Math.abs(n)+" days ago"}
function periods(t){
  var q=Math.floor(t.getMonth()/3),y=t.getFullYear();
  var h=t.getMonth()<6?0:1;
  return {
    q:{s:new Date(y,q*3,1),e:new Date(y,q*3+3,0),label:"Q"+(q+1)},
    h:{s:new Date(y,h*6,1),e:new Date(y,h*6+6,0),label:h?"Jul–Dec":"Jan–Jun"},
    y:{s:new Date(y,0,1),e:new Date(y,11,31),label:String(y)}
  };
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* ---------- rules ---------- */
function cycleSpan(c,t){var d=parse(c.span);while(d<t)d.setFullYear(d.getFullYear()+1);return d}
function paperwork(c,t){
  var S=cycleSpan(c,t),si=iso(S);
  return TASKS.map(function(T){
    var key=c.id+"|"+si+"|"+T.k,opens=add(S,-T.open),due=add(S,-T.due),done=DB.done[key];
    var st=done?"done":(t>due?"overdue":(t>=opens?"open":"later"));
    var wait=(st==="open"&&T.after&&!DB.done[c.id+"|"+si+"|"+T.after])?TASKS.find(function(x){return x.k===T.after}).name:"";
    if(wait)st="later";
    return {kind:"pw",c:c,T:T,key:key,span:S,opens:opens,due:due,done:done,st:st,wait:wait,daysDue:diff(t,due),daysOpen:wait?0:diff(t,opens)};
  });
}
function visitsFor(cid){return DB.visits.filter(function(v){return v.cid===cid}).sort(function(a,b){return a.date<b.date?1:-1})}
function seenIn(list,s,e,type){
  for(var i=0;i<list.length;i++){var d=parse(list[i].date);if(d>=s&&d<=e&&(!type||list[i].types.indexOf(type)>=0))return list[i]}
  return null;
}
function visitReqs(c,t){
  var P=periods(t),vs=visitsFor(c.id),out=[];
  out.push({kind:"vr",c:c,r:"Q",name:"Quarterly visit ("+P.q.label+")",due:P.q.e,met:seenIn(vs,P.q.s,P.q.e,null),type:""});
  out.push({kind:"vr",c:c,r:"H",name:"Home visit ("+P.h.label+")",due:P.h.e,met:seenIn(vs,P.h.s,P.h.e,"H"),type:"H"});
  if(c.dayProgram)out.push({kind:"vr",c:c,r:"D",name:"Day program visit ("+P.y.label+")",due:P.y.e,met:seenIn(vs,P.y.s,P.y.e,"D"),type:"D"});
  out.forEach(function(r){r.daysDue=diff(t,r.due)});
  return out;
}
function revItems(rv,t){
  var c=DB.clients.find(function(x){return x.id===rv.cid})||{id:rv.cid,name:"(deleted client)"},S=parse(rv.start);
  return RTASKS.map(function(R){
    var due=add(S,R.days),done=rv.done[R.k],dd=diff(t,due);
    return {kind:"rv",rv:rv,c:c,R:R,key:rv.id+"|"+R.k,due:due,done:done,daysDue:dd,st:done?"done":dd<0?"overdue":"open"};
  });
}
function revDone(rv){return RTASKS.every(function(R){return rv.done[R.k]})}
function urg(d){return d<0?"p-red":d<=3?"p-amb":"p-blue"}
function revScore(rv,t){var s=0;revItems(rv,t).forEach(function(i){if(!i.done)s=Math.max(s,i.daysDue<0?3:i.daysDue<=3?2:1)});return s}
function revNext(rv,t){return revItems(rv,t).filter(function(i){return !i.done})[0]}
function revByKey(key){var p=key.split("|"),rv=DB.revs.find(function(x){return x.id===p[0]});if(!rv)return null;
  return revItems(rv,today()).find(function(x){return x.R.k===p[1]})}
function clientFlag(c,t){
  var worst=0;
  paperwork(c,t).forEach(function(p){if(p.st==="overdue")worst=Math.max(worst,3);else if(p.st==="open"&&p.daysDue<=14)worst=Math.max(worst,2)});
  visitReqs(c,t).forEach(function(r){if(!r.met&&r.daysDue<=14)worst=Math.max(worst,2)});
  return worst;
}

/* ---------- state ---------- */
var V={tab:"todo",client:null,cview:"client",q:"",vq:"",need:null};
var nav=document.getElementById("nav"),app=document.getElementById("app"),layer=document.getElementById("layer");

function render(){
  nav.innerHTML=[["todo","✓","To Do"],["clients","👥","Clients"],["revs","📝","Revisions"],["visits","🏠","Visits"],["settings","⚙︎","Settings"]].map(function(b){
    return '<button data-a="tab" data-v="'+b[0]+'" class="'+(V.tab===b[0]&&!V.client?"on":"")+'"><i>'+b[1]+'</i>'+b[2]+'</button>'}).join("");
  if(V.client){app.innerHTML=V.cview==="visits"?visitDetailView():detailView();return}
  if(V.need&&V.tab==="visits"){app.innerHTML=needView();return}
  if(V.rev&&V.tab==="revs"){app.innerHTML=revDetailView();return}
  app.innerHTML=V.tab==="todo"?todoView():V.tab==="clients"?clientsView():V.tab==="visits"?visitsView():V.tab==="revs"?revsView():settingsView();
}

/* ---------- To Do ---------- */
function todoItems(t){
  var items=[];
  DB.clients.forEach(function(c){
    paperwork(c,t).forEach(function(p){if(p.st!=="done"&&p.daysOpen<=30)items.push(p)});
    visitReqs(c,t).forEach(function(r){if(!r.met&&r.daysDue<=60)items.push(r)});
  });
  DB.revs.forEach(function(rv){revItems(rv,t).forEach(function(i){if(!i.done)items.push(i)})});
  items.sort(function(a,b){return a.due-b.due||a.c.name.localeCompare(b.c.name)});
  return items;
}
function itemRow(it,t){
  var c=it.c,head='<b>'+esc(c.name)+'</b> · ';
  if(it.kind==="rv"){
    return '<div class="row"><button class="chkwrap" data-a="rcheck" data-v="'+it.key+'" aria-label="Mark done"><span class="chk"></span>Done</button>'+
      '<button class="tap main" data-a="openr" data-v="'+it.rv.id+'"><div class="t">'+head+esc(it.R.name)+'</div>'+
      '<div class="s">Revision started '+fmt(it.rv.start)+'</div><div class="dots"><span class="pill '+urg(it.daysDue)+'">'+
      (it.daysDue<0?Math.abs(it.daysDue)+'d overdue':'due '+inDays(it.daysDue))+'</span><span class="pill p-dim">Revision</span></div></button>'+
      '<button class="icon" data-a="icsr" data-v="'+it.key+'" aria-label="Add reminder">🔔</button></div>';
  }
  if(it.kind==="pw"){
    var pill=it.st==="overdue"?'<span class="pill p-red">'+Math.abs(it.daysDue)+'d overdue</span>':
      it.st==="later"?'<span class="pill p-dim">'+(it.wait?"after "+it.wait:"opens "+fmt(it.opens))+'</span>':
      '<span class="pill '+(it.daysDue<=14?"p-amb":"p-blue")+'">due '+inDays(it.daysDue)+'</span>';
    return '<div class="row"><button class="chkwrap" data-a="check" data-v="'+it.key+'" aria-label="Mark done"><span class="chk"></span>Done</button>'+
      '<button class="tap main" data-a="open" data-v="'+c.id+'"><div class="t">'+head+esc(it.T.name)+'</div>'+
      '<div class="s">Span '+fmt(it.span)+' · due '+fmt(it.due)+'</div><div class="dots">'+pill+'</div></button>'+
      '<button class="icon" data-a="ics1" data-v="'+it.key+'" aria-label="Add reminder">🔔</button></div>';
  }
  var pill2='<span class="pill '+(it.daysDue<0?"p-red":it.daysDue<=14?"p-amb":"p-blue")+'">by '+fmt(it.due)+' · '+inDays(it.daysDue)+'</span>';
  var last=visitsFor(c.id)[0];
  return '<div class="row"><button class="chkwrap" data-a="quick" data-v="'+c.id+'" data-t="'+it.type+'" aria-label="Mark visit done today"><span class="chk"></span>Done</button>'+
    '<button class="tap main" data-a="openv" data-v="'+c.id+'"><div class="t">'+head+esc(it.name)+'</div>'+
    '<div class="s">'+(last?"Last seen "+fmt(last.date)+(last.types?" ("+last.types+")":""):"No visits logged")+'</div><div class="dots">'+pill2+'</div></button>'+
    '<button class="icon" data-a="icsv" data-v="'+c.id+'" data-t="'+it.r+'" aria-label="Add reminder">🔔</button></div>';
}
function todoView(){
  var t=today();
  if(!DB.clients.length)return welcome();
  var items=todoItems(t),P=periods(t);
  var groups=[["Overdue",function(i){return i.daysDue<0}],["Next 2 weeks",function(i){return i.daysDue>=0&&i.daysDue<=14&&!(i.kind==="pw"&&i.st==="later")}],
    ["Next 30 days",function(i){return i.daysDue>14&&i.daysDue<=30&&!(i.kind==="pw"&&i.st==="later")}],["Coming up",function(){return true}]];
  var used={},html="";
  groups.forEach(function(g){
    var rows=items.filter(function(i,ix){if(used[ix])return false;if(g[1](i)){used[ix]=1;return true}return false});
    if(rows.length)html+='<h2>'+g[0]+' · '+rows.length+'</h2><div class="card">'+rows.map(function(r){return itemRow(r,t)}).join("")+'</div>';
  });
  var over=items.filter(function(i){return i.daysDue<0}).length,soon=items.filter(function(i){return i.daysDue>=0&&i.daysDue<=14&&!(i.kind==="pw"&&i.st==="later")}).length;
  var seen=DB.clients.filter(function(c){return seenIn(visitsFor(c.id),P.q.s,P.q.e,null)}).length;
  return '<h1>To Do</h1><div class="sub">'+fmtLong(t)+'</div>'+
    '<div class="stats"><div class="stat red"><b>'+over+'</b><span>Overdue</span></div><div class="stat amb"><b>'+soon+'</b><span>Due in 2 weeks</span></div>'+
    '<div class="stat grn"><b>'+seen+'/'+DB.clients.length+'</b><span>Seen in '+P.q.label+'</span></div></div>'+
    (html||'<div class="card" style="margin-top:18px"><div class="empty">All caught up. Go get a coffee. ☕</div></div>')+
    '<button class="btn ghost wide" data-a="icsall">🔔 Add next 60 days to my calendar</button>';
}
function welcome(){
  return '<h1>Caseload</h1><div class="sub">Clients, paperwork deadlines and visits in one place.</div>'+
    '<div class="card"><div class="empty" style="text-align:left;line-height:1.5">Get started by loading the client file, or add clients one at a time.<br><br>'+
    '<b>Everything stays on this phone.</b> Nothing is sent anywhere.</div></div>'+
    '<button class="btn wide" data-a="import">Load client file</button><button class="btn ghost wide" data-a="addc">Add a client</button>';
}

/* ---------- Clients ---------- */
function clientsView(){
  var t=today(),q=V.q.trim().toLowerCase();
  var list=DB.clients.filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>=0||c.level.toLowerCase().indexOf(q)>=0})
    .sort(function(a,b){return pwScore(b,t)-pwScore(a,t)||cycleSpan(a,t)-cycleSpan(b,t)});
  var need=list.filter(function(c){return pwScore(c,t)>0}),good=list.filter(function(c){return pwScore(c,t)===0});
  function rowsOf(arr){return arr.map(function(c){
    var pw=paperwork(c,t),f=pwScore(c,t);
    var dot=f===3?'<span class="pill p-red">Overdue</span>':f===2?'<span class="pill p-amb">Due soon</span>':'';
    var reqs=pw.map(function(p){return '<span class="pill '+(p.done?"p-green":"p-dim")+'">'+(p.done?"✓ ":"")+p.T.name+'</span>'}).join("");
    return '<button class="row tap" data-a="open" data-v="'+c.id+'"><div class="av">'+esc(c.name.charAt(0))+'</div><div class="main">'+
      '<div class="t">'+esc(c.name)+' <span style="color:var(--dim);font-weight:500">· '+esc(c.level)+'</span></div>'+
      '<div class="s">Span '+fmt(cycleSpan(c,t))+(c.dayProgram?"":" · no day program")+'</div><div class="dots">'+dot+reqs+'</div></div></button>';
  }).join("")}
  var rows=(need.length?'<h2>Paperwork to do · '+need.length+'</h2><div class="card">'+rowsOf(need)+'</div>':'')+
    (good.length?'<h2>All green · '+good.length+'</h2><div class="card">'+rowsOf(good)+'</div>':'');
  return '<div class="hdr"><div><h1>Clients</h1><div class="sub">'+DB.clients.length+' clients · paperwork all done at the bottom</div></div>'+
    '<button class="btn small" data-a="addc" style="margin-top:8px">+ Add</button></div>'+
    '<input class="search" id="q" placeholder="Search name or level" value="'+esc(V.q)+'">'+
    (rows||'<div class="card"><div class="empty">No clients found.</div></div>');
}
function pwScore(c,t){
  var s=0;paperwork(c,t).forEach(function(p){
    if(p.st==="overdue")s=Math.max(s,3);else if(p.st==="open"&&p.daysDue<=14)s=Math.max(s,2);else if(!p.done)s=Math.max(s,1)});
  return s;
}
function needScore(c,t){
  var f=clientFlag(c,t);if(f)return f;
  if(visitReqs(c,t).some(function(r){return !r.met}))return 1;
  if(paperwork(c,t).some(function(p){return p.st==="open"}))return 1;
  return 0;
}
function visitScore(c,t){
  var rq=visitReqs(c,t),s=0;
  rq.forEach(function(r){if(!r.met)s=Math.max(s,r.daysDue<0?3:r.daysDue<=14?2:1)});
  return s;
}

/* ---------- Revisions ---------- */
function revCard(rv,t){
  var it=revItems(rv,t),n=it.filter(function(i){return i.done}).length,sc=revScore(rv,t);
  var rows=it.map(function(i){
    var pill=i.done?'<span class="pill p-green">✓ Done '+fmt(i.done)+'</span>':
      '<span class="pill '+urg(i.daysDue)+'">'+(i.daysDue<0?Math.abs(i.daysDue)+'d overdue':'due '+inDays(i.daysDue))+'</span>';
    return '<div class="row'+(i.done?' faded':'')+'"><button class="chkwrap" data-a="'+(i.done?"runcheck":"rcheck")+'" data-v="'+i.key+'"><span class="chk'+(i.done?" on":"")+'">'+(i.done?"✓":"")+'</span>'+(i.done?"Undo":"Done")+'</button>'+
      '<div class="main"><div class="t">'+i.R.name+'</div><div class="s">Due '+fmt(i.due)+' · '+(i.R.days/7)+' week'+(i.R.days>7?"s":"")+' from start</div><div class="dots">'+pill+'</div></div>'+
      (i.done?'':'<button class="icon" data-a="icsr" data-v="'+i.key+'" aria-label="Add reminder">🔔</button>')+'</div>';
  }).join("");
  return '<div class="card rcard '+(revDone(rv)?"u-grn":sc===3?"u-red":sc===2?"u-amb":"u-blue")+'"><div class="prog" style="margin-top:12px"><div style="width:'+(n*25)+'%"></div></div><div class="progtxt">'+n+' of 4 done</div>'+rows+'</div>';
}
function revsView(){
  var t=today();
  if(!DB.clients.length)return welcome();
  var active=DB.revs.filter(function(rv){return !revDone(rv)}).sort(function(a,b){
    return revScore(b,t)-revScore(a,t)||(revNext(a,t).due-revNext(b,t).due)});
  var fin=DB.revs.filter(revDone).sort(function(a,b){return a.done.pub<b.done.pub?1:-1});
  var over=0,week=0;active.forEach(function(rv){revItems(rv,t).forEach(function(i){if(!i.done){if(i.daysDue<0)over++;else if(i.daysDue<=7)week++}})});
  function rowsOf(arr){return arr.map(function(rv){
    var it=revItems(rv,t),c=it[0].c,sc=revScore(rv,t),nx=revNext(rv,t);
    var tag=sc===3?'<span class="pill p-red">Overdue</span>':sc===2?'<span class="pill p-amb">Due soon</span>':'';
    var pills=it.map(function(i){
      var cls=i.done?"p-green":i.daysDue<0?"p-red":i.daysDue<=3?"p-amb":"p-dim";
      return '<button class="pill tp '+cls+'" data-a="'+(i.done?"runcheck":"rcheck")+'" data-v="'+i.key+'">'+(i.done?"✓ ":"")+i.R.name+'</button>'}).join("");
    var sub=nx?"Next: "+nx.R.name+" "+(nx.daysDue<0?Math.abs(nx.daysDue)+"d overdue":"due "+inDays(nx.daysDue)):"Published "+fmt(rv.done.pub);
    return '<div class="row"><div class="av">'+esc(c.name.charAt(0))+'</div><div class="main">'+
      '<button class="tap" data-a="openr" data-v="'+rv.id+'" style="display:block;width:100%;text-align:left;padding:0;background:none;border:0">'+
      '<div class="t">'+esc(c.name)+' <span style="color:var(--dim);font-weight:500">· started '+fmt(rv.start)+'</span></div>'+
      '<div class="s">'+sub+(rv.note?' · '+esc(rv.note):'')+'</div></button>'+
      '<div class="dots">'+tag+pills+'</div></div><button class="icon" data-a="openr" data-v="'+rv.id+'" aria-label="Open" style="font-size:22px;color:var(--dim)">›</button></div>';
  }).join("")}
  return '<div class="hdr"><div><h1>Revisions</h1><div class="sub">'+active.length+' in progress · finished at the bottom</div></div>'+
    '<button class="btn small" data-a="addr" style="margin-top:8px">+ Add</button></div>'+
    '<div class="stats"><div class="stat red"><b>'+over+'</b><span>Overdue</span></div><div class="stat amb"><b>'+week+'</b><span>Due this week</span></div>'+
    '<div class="stat grn"><b>'+active.length+'</b><span>In progress</span></div></div>'+
    (active.length?'<h2>To do · '+active.length+'</h2><div class="card">'+rowsOf(active)+'</div>':
      '<div class="card" style="margin-top:18px"><div class="empty">No revisions in progress. Tap <b>+ Add</b> when one comes in.</div></div>')+
    (fin.length?'<h2>All green · '+fin.length+'</h2><div class="card">'+rowsOf(fin)+'</div>':'')+
    '<p class="note" style="margin-top:14px">Tap a step to check it off. From the start date: Make changes in 1 week, SOS and Signatures in 2 weeks, Publish in 3 weeks.</p>';
}
function revDetailView(){
  var t=today(),rv=DB.revs.find(function(x){return x.id===V.rev});
  if(!rv){V.rev=null;return revsView()}
  var c=revItems(rv,t)[0].c;
  return '<button class="back" data-a="closer">‹ Revisions</button>'+
    '<div class="hdr"><div><h1>'+esc(c.name)+'</h1><div class="sub">Revision started '+fmt(rv.start)+' · publish by '+fmt(add(parse(rv.start),21))+(rv.note?'<br>'+esc(rv.note):'')+'</div></div>'+
    '<button class="btn small ghost" data-a="editr" data-v="'+rv.id+'" style="margin-top:8px">Edit</button></div>'+
    revCard(rv,t)+
    (c.id&&DB.clients.some(function(x){return x.id===c.id})?'<button class="btn ghost wide" data-a="open" data-v="'+c.id+'">See '+esc(c.name)+'\'s paperwork ›</button>':'');
}
function revSheet(rv,cid){
  var n=!rv;rv=rv||{id:"",cid:cid||"",start:iso(today()),note:"",done:{}};
  var list=DB.clients.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  sheet('<h3>'+(n?"Start a revision":"Edit revision")+'</h3>'+
    '<label>Client</label><select class="field" id="rcid">'+(n&&!rv.cid?'<option value="">Pick a client…</option>':'')+list.map(function(c){
      return '<option value="'+c.id+'"'+(c.id===rv.cid?" selected":"")+'>'+esc(c.name)+'</option>'}).join("")+'</select>'+
    (n?'<button class="btn small ghost" data-a="addcr" style="margin-top:8px">+ New client</button>':'')+
    '<label>Start date</label><input type="date" class="field" id="rstart" value="'+rv.start+'">'+
    '<label>Note (optional)</label><input class="field" id="rnote" value="'+esc(rv.note||"")+'" placeholder="What\'s changing?">'+
    '<div class="actions"><button class="btn ghost" data-a="cancel">Cancel</button><button class="btn" data-a="saver" data-v="'+rv.id+'">'+(n?"Start":"Save")+'</button></div>'+
    (n?'':'<button class="btn danger wide" data-a="delr" data-v="'+rv.id+'">Delete revision</button>'));
}

/* ---------- Visits ---------- */
function reqPills(rq){return rq.map(function(r){return '<span class="pill '+(r.met?"p-green":r.daysDue<=14?"p-amb":"p-dim")+'">'+(r.met?"✓ ":"")+(r.r==="Q"?"Qtr":r.r==="H"?"Home":"Day")+'</span>'}).join("")}
function visitsView(){
  var t=today(),P=periods(t),q=V.vq.trim().toLowerCase();
  if(!DB.clients.length)return welcome();
  var list=DB.clients.filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>=0})
    .sort(function(a,b){return visitScore(b,t)-visitScore(a,t)||a.name.localeCompare(b.name)});
  var seen=DB.clients.filter(function(c){return seenIn(visitsFor(c.id),P.q.s,P.q.e,null)}).length;
  var homeNeed=DB.clients.filter(function(c){return !seenIn(visitsFor(c.id),P.h.s,P.h.e,"H")}).length;
  var dayNeed=DB.clients.filter(function(c){return c.dayProgram&&!seenIn(visitsFor(c.id),P.y.s,P.y.e,"D")}).length;

    '<input class="search" id="vq" placeholder="Search clients" value="'+esc(V.vq)+'" style="margin-top:14px">'+
    (need.length?'<h2>Still need a visit · '+need.length+'</h2><div class="card">'+rowsOf(need)+'</div>':'')+
    (good.length?'<h2>All green · '+good.length+'</h2><div class="card">'+rowsOf(good)+'</div>':'')+
    (list.length?'':'<div class="card"><div class="empty">No clients found.</div></div>');

      '<div class="s">'+(r.met?"Done "+fmt(r.met.date):"Needed by "+fmt(r.due)+" · "+inDays(r.daysDue))+'</div></div>'+

/* ---------- calendar reminders (.ics) ---------- */
function icsEvent(uid,date,title,desc){
  var r=DB.settings.remind,d=iso(date).replace(/-/g,""),e=iso(add(date,1)).replace(/-/g,"");
  var trig=r===0?"PT9H":"-P"+(r-1)+"DT15H";
  return ["BEGIN:VEVENT","UID:"+uid+"@caseload","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z",
    "DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+e,"SUMMARY:"+title.replace(/[,;]/g," "),"DESCRIPTION:"+desc.replace(/[,;]/g," "),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+title.replace(/[,;]/g," "),"TRIGGER:"+trig,"END:VALARM","END:VEVENT"].join("\r\n");
}
function sendIcs(events,name){
  if(!events.length){toast("Nothing to add");return}
  var ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Caseload//EN\r\n"+events.join("\r\n")+"\r\nEND:VCALENDAR";
  var a=document.createElement("a");a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);a.download=name+".ics";
  document.body.appendChild(a);a.click();a.remove();
}
function pwByKey(key){var p=key.split("|"),c=DB.clients.find(function(x){return x.id===p[0]});if(!c)return null;
  return paperwork(c,today()).find(function(x){return x.key===key})}
function evForPw(p){return icsEvent(p.key.replace(/\|/g,"-"),p.due,p.T.name+" due – "+p.c.name,"Span "+fmt(p.span)+". "+p.T.hint+".")}
function evForRv(i){return icsEvent(i.key.replace(/\|/g,"-"),i.due,i.R.name+" (revision) – "+i.c.name,"Revision started "+fmt(i.rv.start)+".")}
function evForVr(r){return icsEvent(r.c.id+"-"+r.r+"-"+iso(r.due),r.due,r.name+" – "+r.c.name,"Visit needed by "+fmt(r.due)+".")}

/* ---------- files ---------- */
function exportData(){
  var blob=new Blob([JSON.stringify({app:"caseload",version:1,clients:DB.clients,visits:DB.visits,done:DB.done,revs:DB.revs,settings:DB.settings},null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="caseload-backup-"+iso(today())+".json";
  document.body.appendChild(a);a.click();a.remove();toast("Backup saved");
}
function importData(){
  var inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){
    try{var d=JSON.parse(rd.result);if(!d.clients)throw 0;
      if(DB.clients.length&&!confirm("Replace the "+DB.clients.length+" clients on this phone with this file?"))return;
      DB.clients=d.clients;DB.visits=d.visits||[];DB.done=d.done||{};DB.revs=d.revs||[];upgrade();if(d.settings)DB.settings=Object.assign(DB.settings,d.settings);
      save();V.client=null;V.tab="todo";render();toast("Loaded "+DB.clients.length+" clients");
    }catch(e){alert("That file didn't look like a Caseload file.")}};rd.readAsText(f)};
  inp.click();
}

/* ---------- toast / undo ---------- */
var tt;
function toast(msg,undo){
  var el=document.querySelector(".toast");if(el)el.remove();clearTimeout(tt);
  el=document.createElement("div");el.className="toast";el.innerHTML="<span>"+esc(msg)+"</span>"+(undo?"<button>Undo</button>":"");
  if(undo)el.querySelector("button").onclick=function(){undo();save();render();el.remove()};
  document.body.appendChild(el);tt=setTimeout(function(){el.remove()},4000);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function nameProblem(n){
  n=n.trim();if(!n)return "Enter a first name.";
  var parts=n.split(/\s+/);
  if(parts.length>1&&parts.slice(1).some(function(p){return p.replace(/\./g,"").length>1}))return "First names only. A last initial (like \"Ruth R\") is OK, but no last names.";
  return "";
}

/* ---------- events ---------- */
document.addEventListener("input",function(e){
  if(e.target.id==="q"||e.target.id==="vq"){var id=e.target.id;V[id]=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById(id);q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==="cname"){document.getElementById("namewarn").textContent=nameProblem(e.target.value)}
});
document.addEventListener("change",function(e){if(e.target.id==="remind"){DB.settings.remind=+e.target.value;save();toast("Reminder timing saved")}});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.getAttribute("data-a"),v=b.getAttribute("data-v"),t=b.getAttribute("data-t");
  if(a==="bg"){if(e.target===b)closeSheet();return}
  if(a==="need"){V.need=v;render();scrollTo(0,0);return}
  if(a==="needclose"){V.need=null;render();scrollTo(0,0);return}
  if(a==="tab"){V.tab=v;V.client=null;V.need=null;V.rev=null;render();scrollTo(0,0);return}
  if(a==="open"||a==="openc"){V.client=v;V.cview="client";render();scrollTo(0,0);return}
  if(a==="openv"){V.client=v;V.cview="visits";render();scrollTo(0,0);return}
  if(a==="pick"){pickSheet();return}
  if(a==="pickc"){logSheet(v,"");return}
  if(a==="close"){V.client=null;render();return}
  if(a==="check"){var p=pwByKey(v);DB.done[v]=iso(today());save();render();toast((p?p.T.name+" done for "+p.c.name:"Marked done"),function(){delete DB.done[v]});return}
  if(a==="uncheck"){var old=DB.done[v];delete DB.done[v];save();render();toast("Marked not done",function(){DB.done[v]=old});return}
  if(a==="log"){logSheet(v,t||"");return}
  if(a==="quick"){var qv={id:uid(),cid:v,date:iso(today()),types:t||"",note:""};DB.visits.push(qv);save();render();
    var qn=DB.clients.find(function(x){return x.id===v}).name;
    toast((t?TYPES[t]+" visit":"Visit")+" done today for "+qn,function(){DB.visits=DB.visits.filter(function(x){return x.id!==qv.id})});return}
  if(a==="vt"){b.classList.toggle("on");return}
  if(a==="cancel"){closeSheet();return}
  if(a==="savev"){
    var date=document.getElementById("vdate").value;if(!date){alert("Pick a date");return}
    var types=[].map.call(document.querySelectorAll("#vtypes .on"),function(x){return x.getAttribute("data-v")}).join("");
    var nv={id:uid(),cid:v,date:date,types:types,note:document.getElementById("vnote").value.trim()};
    DB.visits.push(nv);save();closeSheet();render();
    var cn=DB.clients.find(function(x){return x.id===v}).name;
    toast("Visit logged for "+cn,function(){DB.visits=DB.visits.filter(function(x){return x.id!==nv.id})});return}
  if(a==="delv"){var gone=DB.visits.find(function(x){return x.id===v});DB.visits=DB.visits.filter(function(x){return x.id!==v});save();render();
    toast("Visit deleted",function(){DB.visits.push(gone)});return}
  if(a==="addc"){V.afterAdd=null;clientSheet(null);return}
  if(a==="addcr"){V.afterAdd="rev";clientSheet(null);return}
  if(a==="addr"){revSheet(null);return}
  if(a==="openr"){V.tab="revs";V.rev=v;V.client=null;render();scrollTo(0,0);return}
  if(a==="closer"){V.rev=null;render();scrollTo(0,0);return}
  if(a==="editr"){revSheet(DB.revs.find(function(x){return x.id===v}));return}
  if(a==="saver"){
    var rc=document.getElementById("rcid").value,rs=document.getElementById("rstart").value,rn=document.getElementById("rnote").value.trim();
    if(!rc){alert("Pick a client");return}if(!rs){alert("Pick the start date");return}
    if(v){Object.assign(DB.revs.find(function(x){return x.id===v}),{cid:rc,start:rs,note:rn})}
    else DB.revs.push({id:uid(),cid:rc,start:rs,note:rn,done:{}});
    save();closeSheet();V.tab="revs";V.client=null;render();toast(v?"Saved":"Revision started for "+DB.clients.find(function(x){return x.id===rc}).name);return}
  if(a==="delr"){var gr=DB.revs.find(function(x){return x.id===v});if(!confirm("Delete this revision?"))return;
    DB.revs=DB.revs.filter(function(x){return x.id!==v});V.rev=null;save();closeSheet();render();toast("Revision deleted",function(){DB.revs.push(gr)});return}
  if(a==="rcheck"){var ri=revByKey(v);if(!ri)return;var k=ri.R.k,rv=ri.rv;rv.done[k]=iso(today());save();render();
    toast(revDone(rv)?"Revision finished for "+ri.c.name+" 🎉":ri.R.name+" done for "+ri.c.name,function(){delete rv.done[k]});return}
  if(a==="runcheck"){var ru=revByKey(v);if(!ru)return;var k2=ru.R.k,rv2=ru.rv,old2=rv2.done[k2];delete rv2.done[k2];save();render();
    toast("Marked not done",function(){rv2.done[k2]=old2});return}
  if(a==="icsr"){var ir=revByKey(v);if(ir)sendIcs([evForRv(ir)],"revision-"+ir.R.k+"-"+ir.c.name);return}
  if(a==="editc"){clientSheet(DB.clients.find(function(x){return x.id===v}));return}
  if(a==="lv"){[].forEach.call(document.querySelectorAll("#clevel button"),function(x){x.classList.remove("on")});b.classList.add("on");return}
  if(a==="sw"){b.classList.toggle("on");return}
  if(a==="savec"){
    var nm=document.getElementById("cname").value.trim(),prob=nameProblem(nm);
    if(prob){document.getElementById("namewarn").textContent=prob;return}
    var lv=document.querySelector("#clevel .on"),sp=document.getElementById("cspan").value;
    if(!sp){alert("Pick the span start date");return}
    var data={name:nm,level:lv?lv.getAttribute("data-v"):"L1",span:sp,dayProgram:document.getElementById("cdp").classList.contains("on"),notes:document.getElementById("cnotes").value.trim()};
    if(v){Object.assign(DB.clients.find(function(x){return x.id===v}),data)}
    else{data.id=uid();DB.clients.push(data);if(V.afterAdd==="rev"){V.afterAdd=null;save();revSheet(null,data.id);toast("Client added");return}V.client=data.id}
    save();closeSheet();render();toast("Saved");return}
  if(a==="delc"){var c=DB.clients.find(function(x){return x.id===v});if(!confirm("Delete "+c.name+" and all their visits?"))return;
    DB.clients=DB.clients.filter(function(x){return x.id!==v});DB.visits=DB.visits.filter(function(x){return x.cid!==v});DB.revs=DB.revs.filter(function(x){return x.cid!==v});
    Object.keys(DB.done).forEach(function(k){if(k.indexOf(v+"|")===0)delete DB.done[k]});save();closeSheet();V.client=null;render();toast("Client deleted");return}
  if(a==="ics1"){var pp=pwByKey(v);if(pp)sendIcs([evForPw(pp)],pp.T.k+"-"+pp.c.name);return}
  if(a==="icsv"){var cl=DB.clients.find(function(x){return x.id===v}),r=visitReqs(cl,today()).find(function(x){return x.r===t});if(r)sendIcs([evForVr(r)],"visit-"+cl.name);return}
  if(a==="icsall"){var td=today(),ev=[];DB.clients.forEach(function(c){
      paperwork(c,td).forEach(function(p){if(p.st!=="done"&&p.daysDue>=0&&p.daysDue<=60)ev.push(evForPw(p))});
      visitReqs(c,td).forEach(function(r){if(!r.met&&r.daysDue>=0&&r.daysDue<=60)ev.push(evForVr(r))});});
    DB.revs.forEach(function(rv){revItems(rv,td).forEach(function(i){if(!i.done&&i.daysDue>=0)ev.push(evForRv(i))})});
    sendIcs(ev,"caseload-next-60-days");return}
  if(a==="export"){exportData();return}
  if(a==="import"){importData();return}
  if(a==="wipe"){if(confirm("Erase all clients, visits and checkmarks on this phone? Save a backup first if you're not sure.")&&confirm("Really erase everything?")){
    DB={clients:[],visits:[],done:{},revs:[],settings:{remind:3}};save();V.client=null;render()}return}
});
window.addEventListener("pageshow",function(){render()});
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});

load();render();
})();
</script>
</body>
</html>
